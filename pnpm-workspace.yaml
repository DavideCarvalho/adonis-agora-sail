packages:
  - "packages/*"

# pnpm >= 10 nao roda build script de dependencia sem permissao explicita, e em CI ele
# ERRA (ERR_PNPM_IGNORED_BUILDS) em vez de so avisar. Sem liberar, o
# `pnpm install --frozen-lockfile` do release quebra antes de chegar no changesets.
allowBuilds:
  '@biomejs/biome': true
  esbuild: true

minimumReleaseAgeExclude:
  - '@poppinss/utils@7.1.0'
